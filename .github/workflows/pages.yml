name: Publish FREE WAY
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build web for repository URL
        # ORS_API_KEY (facoltativo) attiva i percorsi in sedia a rotelle di
        # OpenRouteService; senza il secret l'app usa OSRM.
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: flutter build web --release --pwa-strategy=none --base-href "/${{ github.event.repository.name }}/" --dart-define=ORS_API_KEY="$ORS_API_KEY"
      - name: Version application entrypoints to prevent stale browser caches
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path("build/web")
          version = os.environ["RELEASE_SHA"][:12]
          main_name = f"main.{version}.dart.js"
          bootstrap_name = f"flutter_bootstrap.{version}.js"
          (root / "main.dart.js").rename(root / main_name)
          bootstrap = (root / "flutter_bootstrap.js").read_text()
          bootstrap = bootstrap.replace('"mainJsPath":"main.dart.js"', f'"mainJsPath":"{main_name}"')
          (root / bootstrap_name).write_text(bootstrap)
          index = root / "index.html"
          index.write_text(index.read_text().replace("flutter_bootstrap.js", bootstrap_name))
          PY
      - name: Disable Jekyll
        run: touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
