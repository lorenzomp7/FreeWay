name: Publish FreeWay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Test del Worker del traffico
        run: node --test tools/traffic-worker/worker.test.mjs
      - name: Build web for repository URL
        # Chiavi facoltative: ORS_API_KEY attiva i percorsi in sedia a rotelle
        # di OpenRouteService, RECAPTCHA_SITE_KEY attiva Firebase App Check.
        # TRAFFIC_URL (variabile, non segreto: è un indirizzo pubblico) attiva
        # il traffico tramite il Worker di tools/traffic-worker. CARTO_KEY
        # attiva le tile nitide di CARTO (senza: tile di OpenStreetMap).
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          TRAFFIC_URL: ${{ vars.TRAFFIC_URL }}
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: >-
          flutter build web --release --pwa-strategy=none
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=ORS_API_KEY="$ORS_API_KEY"
          --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY"
          --dart-define=TRAFFIC_URL="$TRAFFIC_URL"
          --dart-define=CARTO_KEY="$CARTO_KEY"
      - name: Version application entrypoints to prevent stale browser caches
        run: python3 tool/version_entrypoints.py build/web "${{ github.sha }}"
      - name: Disable Jekyll
        run: touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
