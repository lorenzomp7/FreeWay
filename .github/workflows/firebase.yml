name: Deploy to Firebase
# Pubblica l'app su Firebase Hosting (progetto-rimosso.web.app) e le regole di
# Firestore a ogni push su master. Prima prova le regole con l'emulatore: se un
# test fallisce non si pubblica nulla. Nelle pull request esegue solo i test.
# La pubblicazione richiede il secret FIREBASE_SERVICE_ACCOUNT (vedi README).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rules-test:
    name: Test regole Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore_tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

  deploy:
    name: Pubblica su Firebase
    needs: rules-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check credentials
        id: check
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT assente: pubblicazione su Firebase saltata."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.enabled == 'true'
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore_tests/package-lock.json
      - name: Build web
        if: steps.check.outputs.enabled == 'true'
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          flutter pub get
          flutter test
          flutter build web --release --pwa-strategy=none --base-href / \
            --dart-define=ORS_API_KEY="$ORS_API_KEY" \
            --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY"
          python3 tool/version_entrypoints.py build/web "${{ github.sha }}"
      - name: Install Firebase CLI
        if: steps.check.outputs.enabled == 'true'
        working-directory: firestore_tests
        run: npm ci
      - name: Deploy hosting and Firestore rules
        if: steps.check.outputs.enabled == 'true'
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          firestore_tests/node_modules/.bin/firebase deploy \
            --only hosting,firestore:rules \
            --project progetto-rimosso \
            --non-interactive \
            --message "${{ github.sha }}"
          rm -f "$credentials"
