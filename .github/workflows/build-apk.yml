name: Build APK

# Compila l'app Android (Flutter) e, sui push su main, pubblica l'APK nella
# release «Ultima build». Su main_claude e nelle pull request compila soltanto.
on:
  push:
    branches: [main, main_claude]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths: ["lib/**", "android/**", "assets/**", "pubspec.yaml", "pubspec.lock"]
  workflow_dispatch:

permissions:
  contents: write

# Un solo build per branch: un push nuovo annulla quello vecchio ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Stesse chiavi facoltative della versione web (vedi pages.yml): finiscono
      # comunque nel client, quindi niente segreti veri.
      - name: Compila l'APK
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          TRAFFIC_URL: ${{ vars.TRAFFIC_URL }}
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=ORS_API_KEY="$ORS_API_KEY"
          --dart-define=TRAFFIC_URL="$TRAFFIC_URL"
          --dart-define=CARTO_KEY="$CARTO_KEY"

      - name: Rinomina APK
        run: cp build/app/outputs/flutter-apk/app-release.apk FreeWay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreeWay-apk
          path: FreeWay.apk

      - name: Pubblica nella release «ultima-build»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultima-build >/dev/null 2>&1 || \
            gh release create ultima-build --title "Ultima build" \
              --notes "APK Android aggiornato automaticamente a ogni push su main. Firmato con android/app/debug.keystore, quindi si installa come aggiornamento delle build precedenti." || true
          gh release upload ultima-build FreeWay.apk --clobber
