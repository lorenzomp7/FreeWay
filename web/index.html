<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FREE WAY: percorsi pedonali accessibili e segnalazione di barriere architettoniche. Un progetto di Enactus UniBs.">
  <meta name="theme-color" content="#EC0414">
  <meta name="google-signin-client_id" content="RIMOSSO">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FREE WAY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FREE WAY</title>
  <link rel="manifest" href="manifest.json">

  <!-- Collegamenti anticipati ai server usati all'avvio: motore grafico di
       Flutter e SDK Firebase (www.gstatic.com), font (fonts.gstatic.com),
       mappa (tile.openstreetmap.org). Si risparmia una connessione ciascuno. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="preload" href="assets/assets/banner.png" as="image">

  <!-- Moduli dell'SDK Firebase: il plugin li importa solo dopo l'avvio
       dell'app, uno dopo l'altro. Scaricarli subito, in parallelo al resto,
       anticipa la comparsa della schermata di accesso. La versione deve
       coincidere con quella del plugin firebase_core_web: la controlla
       test/web_index_test.dart. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore-pipelines.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.3.0/firebase-app-check.js">

  <!-- Schermata di avvio in HTML: compare subito, mentre l'app si scarica, e
       sparisce al primo frame di Flutter (stesso aspetto della SplashScreen). -->
  <style>
    html, body { margin: 0; height: 100%; background: #F6F7F9; }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F6F7F9; transition: opacity .25s ease;
    }
    #splash .logo { height: 70px; }
    #splash .bar {
      position: relative; overflow: hidden; width: 120px; height: 4px; margin-top: 24px;
      border-radius: 999px; background: #F1F3F6;
    }
    #splash .bar::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
      border-radius: 999px; background: #EC0414; animation: splash-bar 1.1s ease-in-out infinite;
    }
    @keyframes splash-bar { to { left: 100%; } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #0D0F13; }
      #splash .logo-box { padding: 12px 20px; border-radius: 18px; background: #FFFFFF; }
      #splash .bar { background: #23272F; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; left: 0; width: 100%; opacity: .6; }
    }
  </style>
  <script>
    // Force unregister stale offline-first service workers and clear browser cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
</head>
<body>
  <div id="splash" role="status" aria-label="FREE WAY si sta caricando">
    <div class="logo-box"><img class="logo" src="assets/assets/banner.png" alt="FREE WAY"></div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
